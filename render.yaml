## =============================================================================
## ACULA — Render.com Blueprint (render.yaml)
## Auto-deploys Backend API from this repo via Docker
## =============================================================================

services:
  - type: web
    name: auckland-accountin
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 5000

      - key: BASE_URL
        value: https://auckland-accountin.onrender.com

      - key: TWILIO_WEBHOOK_BASE_URL
        value: https://auckland-accountin.onrender.com

      - key: LOG_LEVEL
        value: info

      # PostgreSQL — Supabase pgbouncer pooler (production-safe)
      - key: DATABASE_URL
        value: postgresql://postgres.xgfqhshyscqopgynuozg:Data%408434562830@aws-0-ap-south-1.pooler.supabase.com:6543/postgres?pgbouncer=true

      - key: DIRECT_URL
        value: postgresql://postgres.xgfqhshyscqopgynuozg:Data%408434562830@aws-0-ap-south-1.pooler.supabase.com:5432/postgres

      # Redis (not available on Render free tier — direct dispatch used)
      - key: REDIS_HOST
        value: "127.0.0.1"

      - key: REDIS_PORT
        value: "6379"

      - key: REDIS_PASSWORD
        value: "none"

      # JWT Secrets
      - key: JWT_SECRET
        value: 62076bedd4da2a8336433e9b54b2e02c946d82af239dd6cfdfa7cad4222f3ef3

      - key: JWT_REFRESH_SECRET
        value: 2c3ecc9759c7d3d9b7e14e0ba475fd9c0f3432b6f045e2a97a363ad7f149d85c

      # Twilio
      - key: TWILIO_ACCOUNT_SID
        value: AC59c3627e754f0a43addb43756a45891a

      - key: TWILIO_AUTH_TOKEN
        value: 5f7ecad671a8325bef816b5f0ceeac47

      - key: TWILIO_PHONE_NUMBER
        value: "+17372508034"

      - key: ENABLE_LIVE_CALLING
        value: "true"

      # CORS — Vercel frontend domain
      - key: CORS_ORIGIN
        value: "https://auckland-accounting.vercel.app"

      - key: CALL_WORKER_CONCURRENCY
        value: "3"
