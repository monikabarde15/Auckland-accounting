## =============================================================================
## ACULA — Render.com Blueprint (render.yaml)
## Auto-deploys Backend API from this repo via Docker
## =============================================================================
## HOW TO USE:
##   1. Go to https://dashboard.render.com/
##   2. Click "New" → "Blueprint"
##   3. Connect your GitHub repo
##   4. Render detects this file and sets up the service automatically
## =============================================================================

services:
  - type: web
    name: acula-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      ## IMPORTANT: Update BASE_URL & TWILIO_WEBHOOK_BASE_URL to your actual Render URL
      - key: BASE_URL
        value: https://auckland-accounting.onrender.com
      - key: TWILIO_WEBHOOK_BASE_URL
        value: https://auckland-accounting.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_HOST
        value: "127.0.0.1"
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        value: ""
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: ENABLE_LIVE_CALLING
        value: "true"
      - key: CORS_ORIGIN
        value: "https://auckland-accounting.vercel.app"
      - key: LOG_LEVEL
        value: info
      - key: CALL_WORKER_CONCURRENCY
        value: "3"
